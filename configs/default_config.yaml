# Configuration for Adaptive Degradation-Aware Chest X-Ray Enhancement

project:
  name: "Adaptive-CXR-Enhancement"
  seed: 42
  device: "auto"  # "cuda", "cpu", or "auto"
  num_threads: 8

data:
  dataset_dir: "data/chest_xray"
  image_size: [224, 224]
  num_channels: 1  # Grayscale Chest X-Ray (1 channel) or 3 for transfer learning
  batch_size: 16
  num_workers: 4
  val_split: 0.15
  test_split: 0.15

degradations:
  # Names matching vector indices: [noise, blur, contrast, compression]
  types: ["noise", "blur", "contrast", "compression"]
  noise:
    min_sigma: 0.02
    max_sigma: 0.25
  blur:
    min_kernel: 3
    max_kernel: 15
    min_sigma: 0.5
    max_sigma: 3.5
  contrast:
    min_factor: 0.2
    max_factor: 0.7
    min_gamma: 0.4
    max_gamma: 2.2
  compression:
    min_quality: 10
    max_quality: 75

detector:  # Model 1
  backbone: "resnet18"
  pretrained: true
  in_channels: 1
  num_degradations: 4
  learning_rate: 0.0003
  weight_decay: 0.0001
  epochs: 15
  checkpoint_dir: "checkpoints/detector"

enhancer:  # Model 2
  in_channels: 1
  out_channels: 1
  base_channels: 32
  cond_dim: 4
  learning_rate: 0.0002
  weight_decay: 0.00001
  epochs: 25
  loss_weights:
    l1: 1.0
    ssim: 0.2
    edge: 0.1
  checkpoint_dir: "checkpoints/enhancer"

disease_models:  # Model 3
  architectures: ["densenet121", "resnet50", "efficientnet_b0"]
  num_classes: 2  # Normal vs Pneumonia
  checkpoint_dir: "checkpoints/disease_models"

evaluation:
  results_dir: "outputs/evaluation"
  visualizations_dir: "outputs/visualizations"
